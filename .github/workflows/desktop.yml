# Builds the Misaki Ordering desktop app for Mac and Windows on GitHub's own
# machines. Run it from the repo's Actions tab ("Build desktop apps" > "Run
# workflow"); when it finishes, the installers are listed under Artifacts.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: desktop:mac
            files: release/*.dmg
            name: misaki-ordering-mac
          - os: windows-latest
            target: desktop:win
            files: release/*.exe
            name: misaki-ordering-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Build installer
        run: npm run ${{ matrix.target }}
        env:
          # The app isn't code-signed yet, so don't look for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
